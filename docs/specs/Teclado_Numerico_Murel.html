<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1729">
<title>Murel · Teclado numérico</title>
<!--
  Teclado numérico do Murel (layout de discador: 1-2-3 / 4-5-6 / 7-8-9 / 0,
  com a coluna da direita: ⌫, Próximo, .- e ,).
  Arquivo único: HTML, CSS e JavaScript. Não usa a API.

  Como usar num campo:
    <input class="num" data-num="inteiro">   só dígitos            (ticket, vagas, km)
    <input class="num" data-num="decimal">   dígitos + vírgula     (valores em R$, até 2 casas)
    <input class="num" data-num="livre">     dígitos , . e -       (toque em ".-" = ponto; segure = hífen)
  "Próximo" vai para o próximo campo .num da tela; no último vira "OK" e fecha.
  O teclado só aparece no celular/tablet (tela de toque, sem mouse);
  no computador o campo usa o teclado físico, com o mesmo filtro.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    --ink:#0E1729; --soft:#F4F1E8; --line:#C9C2B1; --muted:#5A6478; --yellow:#FFC20E;
    --sans:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--soft);color:var(--ink);font-family:var(--sans);min-height:100vh}
  button,input{font:inherit;color:inherit}

  .topo{position:sticky;top:0;z-index:5;background:var(--ink);color:#F4F1E8;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
  .topo h1{margin:0;font-size:18px;font-weight:800}
  main{max-width:560px;margin:0 auto;padding:16px 16px 340px;display:flex;flex-direction:column;gap:18px}

  .sec{display:flex;flex-direction:column;gap:8px}
  .lbl{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .campo{display:flex;align-items:center;height:52px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;gap:8px}
  .campo:focus-within,.campo.foco{outline:2px solid var(--ink);outline-offset:1px}
  .campo span{font-weight:700;color:var(--muted)}
  .campo input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-family:var(--mono);font-size:20px;font-weight:700}
  .campo input::placeholder{color:#A39D8D;font-weight:500}

  /* ================= Teclado numérico ================= */
  .tn{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#16223A;border-top:1px solid #3A4C6B;
      padding:8px 8px calc(10px + env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none;
      transform:translateY(0);transition:transform .18s ease}
  .tn[hidden]{display:block!important;transform:translateY(110%);pointer-events:none;visibility:hidden}
  .tn-grade{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .tn-grade > *{height:58px;border-radius:10px}
  .tn-grade button{border:0;padding:0;touch-action:manipulation;display:flex;align-items:center;justify-content:center}
  /* números: tecla clara */
  .tn-grade .n{background:#2A3A59;color:#F4F1E8;font-family:var(--mono);font-size:28px;font-weight:500}
  .tn-grade .n:active{background:#3A4C6B}
  /* coluna de função e espaços vazios: tecla escura */
  .tn-grade .f,.tn-grade .vazio{background:#0E1729;color:#C9D0DD}
  .tn-grade .f{font-family:var(--mono);font-size:24px;font-weight:700}
  .tn-grade .f:active{background:#22304B}
  .tn-grade .f:disabled{color:#3A4C6B}
  .tn-grade .prox{font-family:var(--sans);font-size:17px;font-weight:800;color:#FFC20E}
  .tn-grade .apagar svg{width:30px;height:22px}
  @media (prefers-reduced-motion:reduce){.tn{transition:none}}
</style>
</head>
<body>
<header class="topo">
  <svg viewBox="4 8 232 148" width="30" height="20" aria-hidden="true"><path d="M20 140V24H220V140M82 24V140M158 24V140" fill="none" stroke="#FFC20E" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M114 62H126A12 12 0 0 1 138 74V116A12 12 0 0 1 126 128H114A12 12 0 0 1 102 116V74A12 12 0 0 1 114 62Z M106.3 88.5H133.7L130.8 75Q120 71 109.2 75Z M108.8 111H131.2L128.8 120Q120 122.2 111.2 120Z" fill="#FFC20E" fill-rule="evenodd"/></svg>
  <h1>Teclado numérico</h1>
</header>

<main>
  <section class="sec">
    <label class="lbl" for="ticket">Nº do ticket</label>
    <div class="campo"><input class="num" id="ticket" data-num="inteiro" maxlength="8" placeholder="Ex.: 104523" autocomplete="off"></div>
  </section>

  <section class="sec">
    <label class="lbl" for="valor">Valor recebido</label>
    <div class="campo"><span>R$</span><input class="num" id="valor" data-num="decimal" maxlength="10" placeholder="0,00" autocomplete="off"></div>
  </section>

  <section class="sec">
    <label class="lbl" for="vagas">Total de vagas</label>
    <div class="campo"><input class="num" id="vagas" data-num="inteiro" maxlength="4" placeholder="Ex.: 70" autocomplete="off"></div>
  </section>
</main>

<div class="tn" id="tecladoNumerico" role="group" aria-label="Teclado numérico" hidden>
  <div class="tn-grade">
    <button type="button" class="n" data-k="1">1</button>
    <button type="button" class="n" data-k="2">2</button>
    <button type="button" class="n" data-k="3">3</button>
    <button type="button" class="f apagar" data-act="apagar" aria-label="Apagar"><svg viewBox="0 0 30 22" aria-hidden="true"><path d="M9 2h17a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H9L2 11z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M14 7l8 8m0-8l-8 8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>

    <button type="button" class="n" data-k="4">4</button>
    <button type="button" class="n" data-k="5">5</button>
    <button type="button" class="n" data-k="6">6</button>
    <button type="button" class="f prox" data-act="proximo" id="tnProx">Próximo</button>

    <button type="button" class="n" data-k="7">7</button>
    <button type="button" class="n" data-k="8">8</button>
    <button type="button" class="n" data-k="9">9</button>
    <button type="button" class="f" data-k="." id="tnPonto" aria-label="Ponto (segure para hífen)">.-</button>

    <div class="vazio" aria-hidden="true"></div>
    <button type="button" class="n" data-k="0">0</button>
    <div class="vazio" aria-hidden="true"></div>
    <button type="button" class="f" data-k="," id="tnVirgula" aria-label="Vírgula">,</button>
  </div>
</div>

<script>
(function () {
  var MOBILE = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
  var kb = document.getElementById('tecladoNumerico');
  var btnProx = document.getElementById('tnProx');
  var btnPonto = document.getElementById('tnPonto');
  var btnVirgula = document.getElementById('tnVirgula');
  var alvo = null, segurou = false, timer = null;

  function campos() { return Array.prototype.slice.call(document.querySelectorAll('input.num')); }
  function modo(el) { return el.dataset.num || 'inteiro'; }

  // Regras de cada modo: o que pode entrar no fim do texto atual
  function aceita(el, v, ch) {
    var max = el.maxLength > 0 ? el.maxLength : 20;
    if (v.length >= max) return false;
    var m = modo(el);
    if (/[0-9]/.test(ch)) {
      if (m === 'decimal' && /,\d{2}$/.test(v)) return false;   // no máximo 2 casas
      return true;
    }
    if (ch === ',') return (m === 'decimal' || m === 'livre') && v.indexOf(',') < 0 && (m === 'livre' || v.length > 0);
    if (ch === '.' || ch === '-') return m === 'livre';
    return false;
  }
  function limpar(el, txt) {
    var v = '';
    for (var i = 0; i < txt.length; i++) if (aceita(el, v, txt[i])) v += txt[i];
    return v;
  }

  function atualizarTeclas() {
    if (!alvo) return;
    var m = modo(alvo), v = alvo.value;
    btnPonto.disabled = m !== 'livre';
    btnVirgula.disabled = !aceita(alvo, v, ',');
    var lista = campos();
    btnProx.textContent = lista.indexOf(alvo) < lista.length - 1 ? 'Próximo' : 'OK';
  }

  function gravar(v) { alvo.value = v; alvo.dispatchEvent(new Event('input', { bubbles: true })); }

  function abrir(el) {
    if (!MOBILE) return;
    if (alvo && alvo !== el) alvo.parentNode.classList.remove('foco');
    alvo = el; alvo.parentNode.classList.add('foco');
    kb.hidden = false; atualizarTeclas();
    setTimeout(function () { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 50);
  }
  function fechar() {
    if (kb.hidden) return;
    kb.hidden = true;
    if (alvo) { alvo.parentNode.classList.remove('foco'); alvo.blur(); }
    alvo = null;
  }

  function tecla(b) {
    if (!b || b.disabled || !alvo) return;
    var v = alvo.value;
    if (b.dataset.act === 'apagar') v = v.slice(0, -1);
    else if (b.dataset.act === 'proximo') {
      var lista = campos(), i = lista.indexOf(alvo);
      if (i < lista.length - 1) { var el = lista[i + 1]; el.focus(); abrir(el); } else fechar();
      return;
    } else if (b.dataset.k && aceita(alvo, v, b.dataset.k)) v += b.dataset.k;
    try { navigator.vibrate && navigator.vibrate(10); } catch (err) {}
    gravar(v);
    atualizarTeclas();
  }

  kb.addEventListener('pointerdown', function (e) {
    e.preventDefault();   // mantém o foco no campo
    var b = e.target.closest('button');
    segurou = false;
    clearTimeout(timer);
    if (b === btnPonto && !b.disabled) {   // segurar ".-" = hífen
      timer = setTimeout(function () {
        segurou = true;
        if (alvo && aceita(alvo, alvo.value, '-')) { gravar(alvo.value + '-'); atualizarTeclas(); }
      }, 450);
    }
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
    kb.addEventListener(ev, function () { clearTimeout(timer); });
  });
  kb.addEventListener('click', function (e) {
    if (segurou) { segurou = false; return; }
    tecla(e.target.closest('button'));
  });

  campos().forEach(function (el) {
    if (MOBILE) el.setAttribute('inputmode', 'none');
    else el.setAttribute('inputmode', modo(el) === 'inteiro' ? 'numeric' : 'decimal');
    el.setAttribute('autocorrect', 'off'); el.setAttribute('spellcheck', 'false');
    el.addEventListener('focus', function () { abrir(el); });
    el.addEventListener('click', function () { abrir(el); });
    el.addEventListener('beforeinput', function (e) {   // teclado físico: só o que o modo aceita
      if (e.inputType !== 'insertText' || !e.data) return;
      var v = el.value.slice(0, el.selectionStart) + el.value.slice(el.selectionEnd);
      if (e.data.length === 1 && !aceita(el, v, e.data)) e.preventDefault();
    });
    el.addEventListener('input', function () {           // colar: limpa o que não cabe
      var v = limpar(el, el.value);
      if (v !== el.value) el.value = v;
      if (alvo === el) atualizarTeclas();
    });
  });

  document.addEventListener('pointerdown', function (e) {
    if (kb.hidden || kb.contains(e.target) || (e.target.classList && e.target.classList.contains('num'))) return;
    fechar();
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden) fechar(); });
})();
</script>
</body>
</html>
